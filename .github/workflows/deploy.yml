name: Deploy MagiClass to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build production bundle
        run: npm run build

      - name: Prepare GitHub Pages static files and verify dist
        run: |
          test -d dist || { echo "Errore: cartella dist non generata"; exit 1; }
          test -f dist/index.html || { echo "Errore: dist/index.html mancante"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "Errore: dist/manifest.webmanifest mancante"; exit 1; }
          test -f dist/sw.js || { echo "Errore: dist/sw.js mancante"; exit 1; }
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          ls -la dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
